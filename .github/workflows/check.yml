name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node@26.12.1 pnpm@10
      - run: mise exec node@26.12.1 -- npm install --global node-gyp@11.5.0
      - run: mise exec node@26.12.1 pnpm@10 -- pnpm install --frozen-lockfile
      - run: mise exec node@26.12.1 pnpm@10 -- pnpm run lint
      - run: mise exec node@26.12.1 pnpm@10 -- pnpm run typecheck
      - run: mise exec node@26.12.1 pnpm@10 -- pnpm run build

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t notscared-runtime-check .
      - run: sh scripts/check-runtime.sh notscared-runtime-check
